name: APK Gradle Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/apk-gradle-release.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: https://jumbakserver-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Expo configuration
        working-directory: apps/mobile
        run: pnpm exec expo config --type public
      - name: Prebuild Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --non-interactive
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Copy APK
        run: mkdir -p dist && cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk dist/jnbk-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jnbk-release-apk
          path: dist/jnbk-release.apk
